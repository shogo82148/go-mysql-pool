name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.25"
          - "1.24"
        mysql:
          - "26.7" # latest
          - "9.7" # LTS
          - "8.4" # LTS
          - "8.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: setup MySQL
        uses: shogo82148/actions-setup-mysql@v1.56.1
        with:
          mysql-version: ${{ matrix.mysql }}
          root-password: verysecret

      - name: Run tests
        run: |
          go test -v -coverprofile=coverage.txt ./...
        env:
          MYSQLPOOL_USER: root
          MYSQLPOOL_PASS: verysecret
          MYSQLPOOL_HOST: 127.0.0.1
          MYSQLPOOL_PORT: 3306

      - name: Send coverage to codecov.io
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: GO
          root_dir: .
        env:
          GO: ${{ matrix.go }}
