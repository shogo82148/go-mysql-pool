name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "1.25"
          - "1.24"
        mysql:
          - "26.7" # latest
          - "9.7" # LTS
          - "8.4" # LTS
          - "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: setup MySQL
        uses: shogo82148/actions-setup-mysql@083ec148d28e62f2b24b8f4541693dfe1d50488d # v1.54.0
        with:
          mysql-version: ${{ matrix.mysql }}
          root-password: verysecret

      - name: Run tests
        run: |
          go test -v -coverprofile=coverage.txt ./...
        env:
          MYSQLPOOL_USER: root
          MYSQLPOOL_PASS: verysecret
          MYSQLPOOL_HOST: 127.0.0.1
          MYSQLPOOL_PORT: 3306

      - name: Send coverage to codecov.io
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: GO
          root_dir: .
        env:
          GO: ${{ matrix.go }}
